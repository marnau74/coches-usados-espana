[project]
name = "coches-usados"
version = "1.0.0"
description = "Mercado de vehículos de segunda mano en España con datos oficiales de la DGT y Eurostat."
readme = "README.md"
license = "MIT"
authors = [{ name = "Mario Arnau" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "dagster>=1.13",
    "dagster-dbt>=0.29",
    "dbt-core>=1.10",
    "dbt-duckdb>=1.10",
    "duckdb>=1.5",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "dagster-webserver>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.16",
    "sqlfluff>=3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coches_usados"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # avisos de estilo
    "I",   # orden de imports
    "UP",  # sintaxis moderna de Python
    "B",   # errores habituales (bugbear)
    "SIM", # simplificaciones
    "PD",  # buenas prácticas de pandas
]

[tool.ruff.lint.per-file-ignores]
# Consultas SQL en una sola línea de texto y cadenas de prueba: partirlas empeora la lectura.
"tests/**" = ["E501"]
"src/coches_usados/report/indicadores.py" = ["E501"]

[tool.dagster]
module_name = "coches_usados.definitions"
